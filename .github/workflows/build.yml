name: Build and Test Cross-Platform Releases

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]

jobs:
  typecheck-and-test:
    name: TypeScript Check & Unit Testing
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # App toolchain stays on Node 20 (README: 20.x / 22.x). Action runtimes below use Node 24.
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        # ffmpeg-static postinstall downloads platform binaries from GitHub Releases;
        # macos-latest (darwin-arm64) occasionally gets HTTP 500 from the CDN.
        # Explicit bash so the retry loop also works on windows-latest (pwsh default).
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if npm ci; then
              exit 0
            fi
            echo "::warning::npm ci failed (attempt ${attempt}/5) — retrying after backoff"
            sleep $((attempt * 8))
          done
          echo "::error::npm ci failed after 5 attempts"
          exit 1

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Build frontend & main bundles
        run: npm run build

  build-executables:
    name: Build Release Package (${{ matrix.os }})
    needs: typecheck-and-test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # App toolchain stays on Node 20 (README: 20.x / 22.x). Action runtimes below use Node 24.
          node-version: 20
          cache: 'npm'

      - name: Install Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libpulse-dev

      - name: Install dependencies
        # Same ffmpeg-static CDN flakiness as typecheck job (esp. darwin-arm64).
        # Explicit bash so the retry loop also works on windows-latest (pwsh default).
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if npm ci; then
              exit 0
            fi
            echo "::warning::npm ci failed (attempt ${attempt}/5) — retrying after backoff"
            sleep $((attempt * 8))
          done
          echo "::error::npm ci failed after 5 attempts"
          exit 1

      - name: Build Vite bundles
        run: npm run build

      - name: Build Electron Release Package
        run: npm run electron:build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.os }}
          path: release/*
          if-no-files-found: warn
